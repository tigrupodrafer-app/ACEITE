name: Validar ACEITE (PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testar contrato SIC (dados sintéticos)
        run: node --test tests/sicPedidoAdapter.test.js tests/sicPedidoSnapshot.test.js tests/sicPedidoMigration.test.js
      - name: Compilar aplicação
        run: npm run build
